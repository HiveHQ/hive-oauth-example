<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hive OAuth Example — Callback</title>
  </head>
  <body>
    <h1>Successfully Authorized!</h1>
    <pre id="tokenOutput">Exchanging code for token…</pre>
    <a href="index.html">Back to Home</a>
    <script type="module">
      import { handleCallback } from "./oauth.js";
  
      try {
        const tokenResponse = await handleCallback();
        document.getElementById("tokenOutput").textContent = JSON.stringify(tokenResponse, null, 2);
      } catch (err) {
        document.getElementById("tokenOutput").textContent = `Error: ${err.message}`;
      }
    </script>
  </body>
</html>
