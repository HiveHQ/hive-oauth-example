<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hive OAuth Example</title>
  </head>
  <body>
    <h1>Hive API v2 — OAuth 2.0 Example</h1>
    <button id="authorizeBtn">Authorize Application</button>
    <script type="module">
      import { startAuthFlow } from "./oauth.js";

      document.getElementById("authorizeBtn").addEventListener("click", async () => {
        await startAuthFlow();
      });
    </script>
  </body>
</html>
